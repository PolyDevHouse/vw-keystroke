<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12321f"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42e08d"/>
      <stop offset="1" stop-color="#25a862"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#badge)" stroke="#243044" stroke-width="2"/>

  <!-- keycap: soft 3D with a base ledge + rounded top -->
  <rect x="28" y="44" width="72" height="58" rx="16" fill="#177a49"/>
  <rect x="28" y="34" width="72" height="60" rx="16" fill="url(#cap)"/>
  <!-- glossy highlight -->
  <rect x="35" y="40" width="58" height="22" rx="11" fill="url(#gloss)"/>

  <!-- VW, drawn as friendly rounded chevrons -->
  <g fill="none" stroke="#0b3a24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 52 L47 80 L58 52"/>
    <path d="M62 52 L70 80 L77 62 L84 80 L92 52"/>
  </g>

  <!-- cute sparkle -->
  <g fill="#8affc0">
    <path d="M99 30 q1.6 5.2 6.8 6.8 q-5.2 1.6 -6.8 6.8 q-1.6 -5.2 -6.8 -6.8 q5.2 -1.6 6.8 -6.8 z"/>
  </g>
</svg>
